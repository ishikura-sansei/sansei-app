<title>SANSEI 現場メニュー</title>
<style>
:root{--orange:#F5820A;--navy:#1F2A44;--cream:#FCEBD9;--line:#e7e7ea;--muted:#6b7280;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:#f4f5f7;color:var(--navy);font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.5;}
header{background:linear-gradient(135deg,var(--navy),#2c3a5e);color:#fff;padding:22px 18px 18px;}
.logo{font-size:26px;font-weight:800;letter-spacing:1px;}
.logo b{color:var(--orange);}
header p{margin:6px 0 0;font-size:13px;opacity:.85;}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 40px;}
a.card{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;
padding:20px 16px;margin-bottom:12px;text-decoration:none;color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.05);}
a.card:active{background:var(--cream);}
.ic{width:52px;height:52px;flex:none;border-radius:14px;background:var(--cream);color:var(--orange);
display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;}
.tx{min-width:0;}
.tx .t{font-weight:700;font-size:18px;}
.tx .d{font-size:13px;color:var(--muted);margin-top:3px;}
.arw{margin-left:auto;color:#c3c6cc;font-size:24px;flex:none;}
footer{text-align:center;font-size:11px;color:var(--muted);padding:20px;}
</style>
</head>
