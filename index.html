<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SANSEI 完工報告</title>
<style>
:root{
  --bg:#ffffff;--panel:#ffffff;--line:#e4e7eb;--ink:#222;--sub:#6b7280;
  --accent:#2f6f9f;--accent-dark:#1e5077;--accent-soft:#eef4f9;
  --ok:#2e7d32;--chip:#f3f5f7;--radius:12px;
  --danger:#C00000;--yellow:#FFF8DC;--bnav:56px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Meiryo",system-ui,sans-serif;
  font-size:16px;line-height:1.5}
body{padding-bottom:calc(var(--bnav)+8px)}

/* ─ ヘッダー ─ */
.hdr{position:sticky;top:0;background:#fff;border-bottom:2px solid var(--accent);
  padding:10px 16px;z-index:20}
.hdr h1{font-size:17px;font-weight:700;color:var(--accent);margin:0 0 6px}
.hdr select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;
  font-size:15px;font-family:inherit;background:#fff;color:var(--ink);outline:none}
.hdr select:focus{border-color:var(--accent)}

/* ─ 画面管理 ─ */
.screen{display:none}
.screen.active{display:block}

/* ─ 検索バー ─ */
.search-wrap{max-width:640px;margin:0 auto;padding:10px 14px 0}
.search-wrap input{width:100%;padding:10px 14px;border:1px solid var(--line);
  border-radius:10px;font-size:16px;font-family:inherit;outline:none;background:#fff;color:var(--ink)}
.search-wrap input:focus{border-color:var(--accent)}

/* ─ カテゴリタブ ─ */
.cat-row{max-width:640px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;
  padding:8px 14px;scrollbar-width:none}
.cat-row::-webkit-scrollbar{display:none}
.cpill{display:inline-flex;align-items:center;background:var(--chip);
  border:1px solid var(--line);border-radius:999px;padding:6px 14px;
  font-size:13px;color:var(--ink);white-space:nowrap;cursor:pointer;flex-shrink:0;
  font-family:inherit;font-weight:600}
.cpill.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ─ カテゴリセクション ─ */
.list-wrap{max-width:640px;margin:0 auto;padding:4px 14px 12px}
.cat-sec{background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);margin:10px 0;overflow:hidden}
.cat-hdr{padding:12px 14px;display:flex;align-items:center;
  justify-content:space-between;cursor:pointer;user-select:none}
.cat-hdr h2{font-size:15px;font-weight:700;margin:0;padding-left:8px;
  border-left:4px solid var(--accent);color:var(--accent)}
.cat-hdr .count{font-size:12px;color:var(--sub);font-weight:400;margin-left:6px}
.cat-hdr .chev{color:var(--sub);font-size:13px;transition:.2s}
.cat-body{border-top:1px solid var(--line)}
.cat-body.closed{display:none}

/* ─ アイテム行 ─ */
.irow{display:flex;align-items:center;padding:12px 14px;
  border-bottom:1px solid var(--line);cursor:pointer;gap:10px;transition:.1s}
.irow:last-child{border-bottom:none}
.irow:active{background:var(--accent-soft)}
.irow-info{flex:1;min-width:0}
.irow-name{font-size:14px;font-weight:600;line-height:1.35}
.irow-note{font-size:12px;color:var(--sub);margin-top:2px}
.irow-unit{font-size:12px;color:var(--sub);white-space:nowrap;flex-shrink:0}
.add-btn{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:20px;
  flex-shrink:0;line-height:1}

/* ─ ボトムナビ ─ */
.bnav{position:fixed;left:0;right:0;bottom:0;background:#fff;
  border-top:1px solid var(--line);height:var(--bnav);display:flex;z-index:20}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;background:none;border:none;cursor:pointer;
  color:var(--sub);font-size:10px;font-family:inherit;padding:4px 0}
.bnav-btn .ico{font-size:22px;line-height:1}
.bnav-btn.on{color:var(--accent);font-weight:700}
.bdg{background:var(--danger);color:#fff;border-radius:8px;font-size:10px;
  padding:1px 5px;min-width:16px;text-align:center}

/* ─ 共通ボタン ─ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;
  padding:10px 18px;border-radius:10px;font-size:14px;font-weight:700;
  font-family:inherit;cursor:pointer;border:none;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:active{background:var(--accent-dark)}
.btn-ghost{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.btn-sm{padding:7px 14px;font-size:13px}
.btn-blk{width:100%}

/* ═══ SCREEN 2: 完工報告 ═══ */
.doc-wrap{max-width:640px;margin:0 auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:13px;font-weight:700;color:var(--sub)}
.fld input,.fld select,.fld textarea{padding:9px 12px;border:1px solid var(--line);
  border-radius:10px;font-size:15px;font-family:inherit;outline:none;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent)}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cli-disp{padding:9px 12px;border:1px solid var(--line);border-radius:10px;
  font-size:15px;background:var(--chip);color:var(--ink);font-weight:600;min-height:44px;
  display:flex;align-items:center}
.note-box{background:var(--accent-soft);border:1px solid #d6e6f2;border-radius:10px;
  padding:8px 12px;font-size:12px;color:#34536b}
.line-area{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;
  font-size:12px;font-family:"Hiragino Kaku Gothic ProN","Meiryo",monospace;
  line-height:1.75;resize:none;background:var(--chip);color:var(--ink)}

/* ─ 施工写真チェックリスト ─ */
.check-section{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.check-sec-hdr{background:var(--accent);color:#fff;padding:10px 14px;
  font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.check-group{border-top:1px solid var(--line)}
.check-group-title{padding:7px 14px;font-size:12px;font-weight:700;
  color:var(--sub);background:var(--accent-soft);border-bottom:1px solid var(--line)}
.check-item{display:flex;align-items:center;gap:10px;padding:11px 14px;
  border-bottom:1px solid var(--line);cursor:pointer;transition:.1s;-webkit-tap-highlight-color:transparent}
.check-item:last-child{border-bottom:none}
.check-item:active{background:var(--accent-soft)}
.check-item input[type=checkbox]{width:20px;height:20px;flex-shrink:0;
  cursor:pointer;accent-color:var(--accent)}
.check-item label{font-size:14px;cursor:pointer;flex:1;line-height:1.4;user-select:none}
.check-item.req label::after{content:'★';color:var(--danger);font-size:10px;margin-left:3px;vertical-align:top}
.check-item.checked label{color:var(--ok)}
.check-progress{display:flex;align-items:center;gap:8px}
.check-progress span{font-size:13px;font-weight:700}
.progress-bar{width:70px;height:6px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:#fff;border-radius:3px;transition:.3s}

/* ─ 数量入力シート ─ */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-end}
.sheet-bg.hid{display:none}
.sheet{background:#fff;border-radius:14px 14px 0 0;padding:16px;width:100%;max-height:80vh;overflow-y:auto}
.handle{width:36px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 14px}
.sheet-title{font-size:16px;font-weight:700;margin-bottom:4px;color:var(--ink)}
.sheet-meta{font-size:12px;color:var(--sub);margin-bottom:14px;line-height:1.6}
.sfld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.sfld label{font-size:13px;font-weight:700;color:var(--sub)}
.sfld select,.sfld input{padding:9px 12px;border:1px solid var(--line);
  border-radius:10px;font-size:15px;font-family:inherit;outline:none}
.sfld select:focus,.sfld input:focus{border-color:var(--accent)}
.sheet-acts{display:flex;gap:8px;margin-top:14px}

/* ─ 読み込みオーバーレイ ─ */
#loadOverlay{display:none;position:fixed;inset:0;background:rgba(47,111,159,0.9);
  z-index:9999;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:44px;height:44px;border:4px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:spin 0.9s linear infinite}

/* ─ トースト ─ */
#copyToast{display:none;position:fixed;bottom:72px;left:50%;transform:translateX(-50%);
  background:var(--ok);color:#fff;padding:10px 24px;border-radius:20px;
  font-size:14px;font-weight:700;z-index:300;white-space:nowrap}
</style>
</head>
<body>

<!-- ヘッダー -->
<div class="hdr">
  <h1>📋 SANSEI 完工報告</h1>
  <select id="clientSel" onchange="switchClient(this.value)"></select>
</div>

<!-- ══ Screen 1: 施工項目 ══ -->
<div class="screen active" id="s1">
  <div class="search-wrap">
    <input type="search" id="srch" placeholder="🔍 項目を検索…" oninput="renderList()">
  </div>
  <div class="cat-row" id="catRow"></div>
  <div class="list-wrap" id="listArea"></div>
</div>

<!-- ══ Screen 2: 完工報告 ══ -->
<div class="screen" id="s2">
  <div class="doc-wrap">
    <!-- 基本情報 -->
    <div class="fg2">
      <div class="fld">
        <label>施工日</label>
        <input type="date" id="docDate" onchange="genLine()">
      </div>
      <div class="fld">
        <label>取引先</label>
        <div class="cli-disp" id="docCli">—</div>
      </div>
    </div>
    <div class="fld">
      <label>件名（現場名）</label>
      <input id="docSubj" placeholder="例: 山田太郎様邸" oninput="genLine()">
    </div>
    <!-- 工事種別 -->
    <div class="fld">
      <label>工事種別</label>
      <select id="workType" onchange="renderChecklist();genLine()">
        <option value="common">通常工事</option>
        <option value="dr">DR申請（蓄電池）</option>
        <option value="tokyo">都助成金（太陽光・蓄電池）</option>
        <option value="ecocute">エコキュート</option>
        <option value="v2h">V2H</option>
        <option value="other">その他</option>
      </select>
    </div>
    <!-- 施工写真チェックリスト -->
    <div class="check-section">
      <div class="check-sec-hdr">
        <span>📷 施工写真チェック</span>
        <div class="check-progress">
          <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
          <span id="progText">0/0</span>
        </div>
      </div>
      <div id="checklistArea"></div>
    </div>
    <!-- 施工内容サマリー -->
    <div id="itemSummary" class="note-box" style="display:none">
      <strong style="display:block;margin-bottom:4px;font-size:13px">🔧 施工項目</strong>
      <div id="itemSummaryList" style="font-size:13px;line-height:1.9"></div>
      <button class="btn btn-ghost btn-sm" style="margin-top:8px;width:100%" onclick="goS('s1')">＋ 項目追加</button>
    </div>
    <div id="itemEmpty" style="background:var(--yellow);border:1px solid #e0cc40;border-radius:10px;padding:10px 12px">
      <div style="font-size:13px;color:#5a4a00">⚠️ 施工項目が未入力です</div>
      <button class="btn btn-ghost btn-sm" style="margin-top:8px;width:100%" onclick="goS('s1')">📋 施工項目を選択する</button>
    </div>
    <!-- 備考 -->
    <div class="fld">
      <label>備考・特記事項</label>
      <textarea id="docRmk" rows="2" placeholder="任意" oninput="genLine()"></textarea>
    </div>
    <!-- LINE出力 -->
    <div class="fld">
      <label>📱 LINEに貼り付けるテキスト</label>
      <textarea class="line-area" id="lineText" readonly rows="16"></textarea>
    </div>
    <button class="btn btn-primary btn-blk" style="font-size:15px;padding:14px" onclick="copyLine()">
      📋 コピーする（LINEに貼り付け）
    </button>
    <!-- 単価マスター更新 -->
    <div class="note-box">
      <strong style="display:block;margin-bottom:4px;font-size:13px">📥 単価マスター更新（CSV読み込み）</strong>
      列順: 摘要 / 単価 / 単位 / 補足 / カテゴリ
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
        <input type="file" id="csvIn" accept=".csv" style="display:none" onchange="importCSV(this)">
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('csvIn').click()">📂 CSVを選択</button>
        <button class="btn btn-ghost btn-sm" onclick="resetMaster()">🔄 GitHubから再取得</button>
      </div>
    </div>
  </div>
</div>

<!-- ボトムナビ（2ボタン） -->
<div class="bnav">
  <button class="bnav-btn on" id="nb1" onclick="goS('s1')">
    <span class="ico">📋</span>
    <span style="display:flex;align-items:center;gap:3px">施工項目<span class="bdg" id="bdg" style="display:none">0</span></span>
  </button>
  <button class="bnav-btn" id="nb2" onclick="goS('s2')">
    <span class="ico">✅</span>完工報告
  </button>
</div>

<!-- 数量入力シート -->
<div class="sheet-bg hid" id="sheetBg">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sheet-title" id="shTitle"></div>
    <div class="sheet-meta" id="shMeta"></div>
    <div id="shForm"></div>
    <div class="sheet-acts">
      <button class="btn btn-ghost" style="flex:1" onclick="closeSheet()">キャンセル</button>
      <button class="btn btn-primary" style="flex:1" id="shAddBtn" onclick="confirmAdd()">施工に追加</button>
    </div>
  </div>
</div>

<!-- 読み込みオーバーレイ -->
<div id="loadOverlay" style="display:none;position:fixed;inset:0;background:rgba(47,111,159,0.9);z-index:9999;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff">
  <div class="spinner"></div>
  <div style="font-size:15px;font-weight:600">データを読み込み中…</div>
</div>

<!-- トースト -->
<div id="copyToast">✓ コピーしました！</div>

<script>
const JSON_URL='https://raw.githubusercontent.com/ishikura-sansei/sansei-app/main/sansei_prices.json';
const CLI_MAP={'リケン':'リケンエナジー','キョウエイ':'株式会社キョウエイ','ライズ':'ライズサポート','ATEL':'ATEL','アルファ':'アルファエレクトロ'};
const CLI_FULL={'リケンエナジー':'リケンエナジー有限会社','ATEL':'ATEL株式会社','株式会社キョウエイ':'株式会社キョウエイ','ライズサポート':'ライズサポート株式会社','アルファエレクトロ':'アルファエレクトロ株式会社'};
const LM='sm3',LE='se3';

/* ─ 施工写真チェックリスト定義 ─ */
const PHOTO_CHECKS={
  common:[
    {id:'c1',label:'施工前 遠景（背景・周辺含む）',req:true},
    {id:'c2',label:'施工前 状況（設置箇所がわかること）',req:true},
    {id:'c3',label:'施工後 近景（正面・全体）',req:true},
    {id:'c4',label:'施工後 遠景（背景含む）',req:true},
    {id:'c5',label:'銘板・型番・シリアルNo（文字鮮明に）',req:true},
    {id:'c6',label:'試運転・起動確認',req:false},
    {id:'c7',label:'ホワイトボードの文字が鮮明か確認',req:false},
  ],
  dr:[
    {id:'d1',label:'ホワイトボード（補助事業者名・交付決定番号・撮影日）',req:true},
    {id:'d2',label:'リモコン 設置前',req:true},
    {id:'d3',label:'リモコン 設置後 近景（起動画面あり）',req:true},
    {id:'d4',label:'リモコン 設置後 遠景',req:true},
    {id:'d5',label:'蓄電池 設置前',req:true},
    {id:'d6',label:'蓄電池 設置後 近景',req:true},
    {id:'d7',label:'蓄電池 設置後 遠景',req:true},
    {id:'d8',label:'パワコン 工事前',req:true},
    {id:'d9',label:'パワコン 工事後 近景',req:true},
    {id:'d10',label:'パワコン 工事後 遠景',req:true},
    {id:'d11',label:'自然ボックス 設置前',req:true},
    {id:'d12',label:'自然ボックス 設置後 近景',req:true},
    {id:'d13',label:'自然ボックス 設置後 遠景',req:true},
    {id:'d14',label:'蓄電池 シリアルNo',req:true},
    {id:'d15',label:'パワコン シリアルNo',req:true},
    {id:'d16',label:'リモコン シリアルNo',req:true},
    {id:'d17',label:'自然ボックス シリアルNo',req:true},
  ],
  tokyo:[
    {id:'t1',label:'全景（玄関正面・家全体）',req:true},
    {id:'t2',label:'パネル設置後 全面',req:true},
  ],
  ecocute:[
    {id:'e1',label:'エコキュート 設置後 全体',req:true},
    {id:'e2',label:'台所リモコン（起動・表示あり）',req:true},
    {id:'e3',label:'ヒートポンプ シリアルNo',req:true},
    {id:'e4',label:'給湯器 シリアルNo',req:true},
  ],
  v2h:[
    {id:'v1',label:'V2H 設置後',req:true},
    {id:'v2',label:'V2H シリアルNo（全種）',req:true},
    {id:'v3',label:'プラグホルダ（一体型は不要）',req:false},
  ],
};

const GROUP_LABELS={
  common:'【共通】施工前後・銘板',
  dr:'【DR申請】各機器・シリアル',
  tokyo:'【都助成金】追加写真',
  ecocute:'【エコキュート】',
  v2h:'【V2H】',
};

const WTYPE_LABEL={
  common:'通常工事',dr:'DR申請（蓄電池）',
  tokyo:'都助成金（太陽光・蓄電池）',ecocute:'エコキュート',v2h:'V2H',other:'その他'
};

function getActiveGroups(wtype){
  const g=[];
  g.push({key:'common',items:PHOTO_CHECKS.common});
  if(wtype==='dr') g.push({key:'dr',items:PHOTO_CHECKS.dr});
  if(wtype==='tokyo'){g.push({key:'dr',items:PHOTO_CHECKS.dr});g.push({key:'tokyo',items:PHOTO_CHECKS.tokyo});}
  if(wtype==='ecocute') g.push({key:'ecocute',items:PHOTO_CHECKS.ecocute});
  if(wtype==='v2h') g.push({key:'v2h',items:PHOTO_CHECKS.v2h});
  return g;
}
function getAllChecks(wtype){return getActiveGroups(wtype).flatMap(g=>g.items);}

/* ─ チェックリスト描画 ─ */
function renderChecklist(){
  const wtype=document.getElementById('workType').value;
  const groups=getActiveGroups(wtype);
  const multi=groups.length>1;
  let h='';
  groups.forEach(g=>{
    h+=`<div class="check-group">`;
    if(multi) h+=`<div class="check-group-title">${GROUP_LABELS[g.key]||g.key}</div>`;
    g.items.forEach(ck=>{
      h+=`<div class="check-item${ck.req?' req':''}" id="ci_${ck.id}" onclick="toggleCheck('${ck.id}')">
        <input type="checkbox" id="ck_${ck.id}" onclick="event.stopPropagation();toggleCheck('${ck.id}')">
        <label for="ck_${ck.id}">${ck.label}</label>
      </div>`;
    });
    h+='</div>';
  });
  document.getElementById('checklistArea').innerHTML=h;
  updProgress();
}

function toggleCheck(id){
  const cb=document.getElementById('ck_'+id);
  cb.checked=!cb.checked;
  document.getElementById('ci_'+id).classList.toggle('checked',cb.checked);
  updProgress();genLine();
}

function updProgress(){
  const wtype=document.getElementById('workType')?.value||'common';
  const all=getAllChecks(wtype);
  const total=all.length;
  const done=all.filter(ck=>document.getElementById('ck_'+ck.id)?.checked).length;
  document.getElementById('progText').textContent=`${done}/${total}`;
  document.getElementById('progFill').style.width=total?`${Math.round(done/total*100)}%`:'0%';
}

/* ─ ノート金額フィルタ ─ */
function filterNote(note){
  if(!note) return '';
  return note.replace(/\+?[¥￥][\d,]+(?:[〜～\/][^\s　]*)?/g,'').replace(/\s{2,}/g,' ').trim();
}

let M={},pend=null,actCat='all',curC='';
let E=JSON.parse(localStorage.getItem(LE)||'null')||{cli:'リケンエナジー',items:[]};
const sM=()=>localStorage.setItem(LM,JSON.stringify(M));
const sE=()=>localStorage.setItem(LE,JSON.stringify(E));

function convertJson(raw){
  const result={};
  for(const [key,items] of Object.entries(raw)){
    const cliName=CLI_MAP[key]||key;
    result[cliName]=items.map(it=>({
      cat:it.category,name:it.name,p1:it.price1,
      p2:it.price2>0?it.price2:undefined,
      unit:it.unit,note:it.note||'',inputType:it.inputType,variants:it.variants
    }));
  }
  return result;
}

async function fetchMaster(){
  try{
    const r=await fetch(JSON_URL+'?t='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    return convertJson(await r.json());
  }catch(e){console.warn('fetch failed:',e);return null;}
}

/* ─ ナビ ─ */
function goS(id){
  ['s1','s2'].forEach(s=>document.getElementById(s).classList.remove('active'));
  document.getElementById(id).classList.add('active');
  ['nb1','nb2'].forEach(b=>document.getElementById(b).classList.remove('on'));
  document.getElementById({s1:'nb1',s2:'nb2'}[id]).classList.add('on');
  if(id==='s2'){updDocCli();updItemSummary();genLine();}
}

function updDocCli(){
  document.getElementById('docCli').textContent=curC||'—';
}

function updItemSummary(){
  const summary=document.getElementById('itemSummary');
  const empty=document.getElementById('itemEmpty');
  if(!E.items.length){summary.style.display='none';empty.style.display='block';return;}
  empty.style.display='none';summary.style.display='block';
  const grp={};
  E.items.forEach(ei=>{grp[ei.cat]=grp[ei.cat]||[];grp[ei.cat].push(ei);});
  let h='';
  for(const [,items] of Object.entries(grp)){
    items.forEach(ei=>{h+=`・${ei.name}${ei.qty===1?'':' ×'+ei.qty}<br>`;});
  }
  document.getElementById('itemSummaryList').innerHTML=h;
}

/* ─ クライアント ─ */
function buildCliSel(){
  document.getElementById('clientSel').innerHTML=
    Object.keys(M).map(c=>`<option${c===curC?' selected':''}>${c}</option>`).join('');
}
function switchClient(v){curC=v;actCat='all';buildCatRow();renderList();updDocCli();}

/* ─ カテゴリタブ ─ */
function buildCatRow(){
  const cats=[...new Set((M[curC]||[]).map(i=>i.cat))];
  document.getElementById('catRow').innerHTML=
    ['all',...cats].map(c=>
      `<span class="cpill${c===actCat?' on':''}" onclick="setC('${c}')">${c==='all'?'全て':c}</span>`
    ).join('');
}
function setC(c){actCat=c;buildCatRow();renderList();}

/* ─ 単価一覧 ─ */
function renderList(){
  const q=(document.getElementById('srch').value||'').toLowerCase();
  const items=(M[curC]||[]).filter(i=>
    (actCat==='all'||i.cat===actCat)&&(!q||i.name.toLowerCase().includes(q))
  );
  const grp={};
  items.forEach(i=>{grp[i.cat]=grp[i.cat]||[];grp[i.cat].push(i);});
  let h='';
  for(const [cat,gi] of Object.entries(grp)){
    h+=`<div class="cat-sec">
      <div class="cat-hdr" onclick="toggleCat(this)">
        <h2>${cat}<span class="count">${gi.length}項目</span></h2>
        <span class="chev">▼</span>
      </div>
      <div class="cat-body">`;
    gi.forEach(item=>{
      const cn=filterNote(item.note);
      const ut=item.unit?`/ ${item.unit}`:'';
      h+=`<div class="irow" onclick="openSheet(${JSON.stringify(item).replace(/"/g,'&quot;')})">
        <div class="irow-info">
          <div class="irow-name">${item.name}</div>
          ${cn?`<div class="irow-note">${cn}</div>`:''}
        </div>
        <div class="irow-unit">${ut}</div>
        <div class="add-btn">＋</div>
      </div>`;
    });
    h+='</div></div>';
  }
  if(!h) h='<div style="text-align:center;padding:50px 20px;color:var(--sub);font-size:14px">該当なし</div>';
  document.getElementById('listArea').innerHTML=h;
}
function toggleCat(el){
  const b=el.nextElementSibling;
  el.querySelector('.chev').textContent=b.classList.toggle('closed')?'▶':'▼';
}

/* ─ 数量シート ─ */
function openSheet(item){
  pend=item;
  document.getElementById('shTitle').textContent=item.name;
  document.getElementById('shMeta').textContent=item.cat+(filterNote(item.note)?'　'+filterNote(item.note):'');
  let h='';
  if(item.variants){
    h+=`<div class="sfld"><label>種別を選択</label><select id="shV">
      ${item.variants.map((v,i)=>`<option value="${i}">${v.l}</option>`).join('')}
    </select></div>`;
  } else if(item.p2){
    h+=`<div class="sfld"><label>種別を選択</label><select id="shP2">
      <option value="${item.p1}">基本</option>
      <option value="${item.p2}">困難</option>
    </select></div>`;
  }
  h+=`<div class="sfld"><label>数量（${item.unit}）</label>
    <input type="number" id="shQ" value="1" min="0.5" step="1"></div>`;
  document.getElementById('shForm').innerHTML=h;
  document.getElementById('sheetBg').classList.remove('hid');
}
function closeSheet(){document.getElementById('sheetBg').classList.add('hid');pend=null;}
function confirmAdd(){
  const item=pend;if(!item)return;
  const vi=document.getElementById('shV');
  const p2=document.getElementById('shP2');
  const vidx=vi?parseInt(vi.value)||0:0;
  const price=item.variants?item.variants[vidx].p:p2?parseFloat(p2.value):item.p1;
  const label=item.variants?item.variants[vidx].l:p2?p2.options[p2.selectedIndex].text:'';
  const qty=parseFloat(document.getElementById('shQ')?.value)||1;
  if(E.cli!==curC){E.cli=curC;E.items=[];}
  E.items.push({name:item.name+(label?`（${label}）`:''),unit:item.unit,cat:item.cat,price,qty,sub:Math.round(price*qty)});
  sE();updBdg();closeSheet();
  const b=document.getElementById('shAddBtn');
  b.textContent='✓ 追加！';setTimeout(()=>b.textContent='施工に追加',700);
}
function updBdg(){
  const n=E.items.length,b=document.getElementById('bdg');
  b.textContent=n;b.style.display=n?'inline':'none';
}

/* ─ LINE生成 ─ */
function genLine(){
  const ta=document.getElementById('lineText');
  const dateStr=document.getElementById('docDate').value||new Date().toISOString().slice(0,10);
  const dsubj=document.getElementById('docSubj').value;
  const drmk=document.getElementById('docRmk').value;
  const wtype=document.getElementById('workType')?.value||'common';
  const bar='─────────────────';
  let lines=[];
  lines.push('【完工報告】');
  lines.push(`施工日：${dateStr}`);
  if(dsubj) lines.push(`現場：${dsubj}`);
  lines.push(`取引先：${CLI_FULL[curC]||curC}`);
  lines.push(`工事種別：${WTYPE_LABEL[wtype]||wtype}`);
  lines.push(bar);lines.push('');
  lines.push('■ 施工内容');
  if(E.items.length){
    const grp={};
    E.items.forEach(ei=>{grp[ei.cat]=grp[ei.cat]||[];grp[ei.cat].push(ei);});
    for(const [,items] of Object.entries(grp)){
      items.forEach(ei=>{lines.push(`・${ei.name}${ei.qty===1?'':' ×'+ei.qty}`);});
    }
  } else {lines.push('（施工内容未入力）');}
  lines.push('');lines.push(bar);lines.push('');
  lines.push('■ 施工写真チェック');
  const groups=getActiveGroups(wtype);
  const multi=groups.length>1;
  groups.forEach(g=>{
    if(multi) lines.push(`▽ ${GROUP_LABELS[g.key]||g.key}`);
    g.items.forEach(ck=>{
      const el=document.getElementById('ck_'+ck.id);
      lines.push(`${el&&el.checked?'☑':'□'} ${ck.label}`);
    });
  });
  lines.push('');lines.push(bar);lines.push('');
  lines.push('■ 特記事項');
  lines.push(drmk||'（なし）');
  ta.value=lines.join('\n');
}

function copyLine(){
  const ta=document.getElementById('lineText');
  if(!ta.value){alert('内容がありません');return;}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(()=>showToast()).catch(()=>fallbackCopy(ta));
  } else {fallbackCopy(ta);}
}
function fallbackCopy(ta){ta.select();try{document.execCommand('copy');showToast();}catch(e){alert('コピーできませんでした');}}
function showToast(){
  const t=document.getElementById('copyToast');
  t.style.display='block';setTimeout(()=>t.style.display='none',2200);
}

function importCSV(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const rows=e.target.result.trim().split('\n');
    const items=[];
    rows.forEach((row,ri)=>{
      if(ri===0)return;
      const cols=row.split(',').map(c=>c.trim().replace(/^"|"$/g,''));
      const name=cols[0]||'',price=parseInt(cols[1])||0,unit=cols[2]||'式',note=cols[3]||'',cat=cols[4]||'その他';
      if(name) items.push({name,price,unit,note,cat});
    });
    if(items.length){M[curC]=items;sM();buildCatRow();renderList();alert(items.length+'件のマスターを更新しました');}
    else alert('有効な行がありませんでした');
  };
  reader.readAsText(file,'UTF-8');
  input.value='';
}

async function resetMaster(){
  if(confirm('GitHubから最新の単価データを再取得しますか？')){
    document.getElementById('loadOverlay').style.display='flex';
    const fresh=await fetchMaster();
    document.getElementById('loadOverlay').style.display='none';
    if(fresh){M=fresh;sM();curC=Object.keys(M)[0];buildCliSel();buildCatRow();renderList();alert('最新データに更新しました');}
    else alert('取得に失敗しました');
  }
}

window.addEventListener('DOMContentLoaded',async()=>{
  document.getElementById('loadOverlay').style.display='flex';
  const fetched=await fetchMaster();
  if(fetched){M=fetched;}
  else{const c=localStorage.getItem(LM);if(c){try{M=JSON.parse(c);}catch(e){}}}
  if(Object.keys(M).length>0){
    curC=E.cli&&M[E.cli]?E.cli:Object.keys(M)[0];
    sM();
  }
  document.getElementById('loadOverlay').style.display='none';
  buildCliSel();
  switchClient(curC);
  updBdg();
  document.getElementById('docDate').valueAsDate=new Date();
  renderChecklist();
});
</script>
